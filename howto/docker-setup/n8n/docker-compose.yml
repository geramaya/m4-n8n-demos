services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    network_mode: host
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ONBOARDING_FLOW_DISABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/output
      # Diese ziehen NUR beim allerersten Start:
      - N8N_USER_MANAGEMENT_MAIN_USER_PASSWORD=changeme
      - N8N_USER_MANAGEMENT_MAIN_USER_EMAIL=your-email@example.com
    volumes:
      - ~/.n8n:/home/node/.n8n
      - /path/to/your/output:/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
